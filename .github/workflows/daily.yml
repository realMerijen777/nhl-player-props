name: Denní data NHL

on:
  schedule:
    - cron: "10 4 * * *"   # 05:10 SEČ / 06:10 SELČ, před plánovanou úlohou v 7:00
  workflow_dispatch:
    inputs:
      date:
        description: "Datum YYYY-MM-DD (prázdné = dnes v Praze)"
        required: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stáhnout data z NHL API
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python fetch_data.py ${{ github.event.inputs.date }}
      - name: Commit
        run: |
          git config user.name "nhl-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Data $(date -u +%F)"
          git push
